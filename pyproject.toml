[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpolish"
version = "0.1.0"
description = "Minimal Markdown polish cleaner: fixes trailing whitespace, blank line tightening, blank heading underlines, missing trailing newline, and repeated blank lines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["markdown", "lint", "clean", "tidy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mdpolish = "mdpolish.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdpolish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
